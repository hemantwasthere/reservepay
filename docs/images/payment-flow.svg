<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">How ReservePay protects a 100 USDC payment</title>
  <desc id="desc">With a five percent reserve rate, the merchant receives 95 USDC immediately and 5 USDC joins at least 95 USDC of existing collateral to cover the full payment. Completion releases the retained 5 USDC and unlocks the liability. Alternatively, the authorized resolver refunds all 100 USDC to the original buyer. A refund request does not extend protection.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#779263" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="780" rx="16" fill="#f6f7f2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#25291f">
    <text x="52" y="52" font-size="13" letter-spacing="2" fill="#526047">RESERVEPAY / PAYMENT LIFECYCLE</text>
    <text x="52" y="90" font-size="29" font-weight="600">Instant settlement. Full-payment coverage.</text>
    <rect x="435" y="122" width="330" height="110" rx="8" fill="#fcfdf9" stroke="#d4dccb"/>
    <text x="600" y="150" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#626d5b">BUYER PAYS</text>
    <text x="600" y="195" text-anchor="middle" font-size="34" font-weight="600">100 USDC</text>
    <g stroke="#779263" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M600 232 V254 H300 V279"/>
      <path d="M600 232 V254 H900 V279"/>
    </g>
    <rect x="70" y="286" width="460" height="142" rx="8" fill="#fcfdf9" stroke="#d4dccb"/>
    <text x="98" y="318" font-size="12" letter-spacing="1.5" fill="#626d5b">TO THE MERCHANT</text>
    <text x="98" y="362" font-size="32" font-weight="600">95 USDC</text>
    <text x="98" y="397" font-size="16" fill="#526047">Available immediately in the merchant’s wallet.</text>
    <rect x="670" y="286" width="460" height="142" rx="8" fill="#eaf0e2" stroke="#c6d4ba"/>
    <text x="698" y="318" font-size="12" letter-spacing="1.5" fill="#486238">TO THE MERCHANT’S RESERVE</text>
    <text x="698" y="362" font-size="30" font-weight="600">5 + 95 = 100 USDC</text>
    <text x="698" y="391" font-size="16" fill="#486238">New retention + existing collateral.</text>
    <text x="698" y="412" font-size="14" fill="#486238">100 USDC of liability stays locked while open.</text>
    <g stroke="#779263" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M900 428 V452 H300 V495"/>
      <path d="M900 428 V495"/>
    </g>
    <text x="600" y="478" text-anchor="middle" font-size="12" letter-spacing="1" fill="#626d5b">ONE FINAL OUTCOME</text>
    <rect x="70" y="502" width="460" height="146" rx="8" fill="#fcfdf9" stroke="#d4dccb"/>
    <text x="98" y="535" font-size="22" font-weight="600">Complete the order</text>
    <text x="98" y="567" font-size="16" fill="#526047">Release the retained 5 USDC to the merchant.</text>
    <text x="98" y="592" font-size="16" fill="#526047">Unlock the full 100 USDC liability.</text>
    <text x="98" y="625" font-size="13" fill="#626d5b">Resolver, or merchant after protection expires.</text>
    <rect x="670" y="502" width="460" height="146" rx="8" fill="#fcfdf9" stroke="#d4dccb"/>
    <text x="698" y="535" font-size="22" font-weight="600">Refund the buyer</text>
    <text x="698" y="567" font-size="16" fill="#526047">Return the full 100 USDC from the reserve</text>
    <text x="698" y="592" font-size="16" fill="#526047">to the original buyer’s token account.</text>
    <text x="698" y="625" font-size="13" fill="#626d5b">Requires the configured resolver’s signature.</text>
    <path d="M52 682 H1148" stroke="#d4dccb"/>
    <text x="52" y="710" font-size="14" fill="#526047">Example: 5% retention, no other open orders, and at least 95 USDC already in reserve.</text>
    <text x="52" y="736" font-size="14" fill="#526047">Requests do not freeze orders or extend protection. Completed orders cannot be refunded. Devnet only.</text>
  </g>
</svg>
