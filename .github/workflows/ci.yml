name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (tags can move); the comment
# names the tag each SHA resolved to.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@40301559af1f79edd8d81a67e9cf77c56ebfb2d3 # 1.79.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: cargo check

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # cold anchor-cli install + lto=fat build can exceed 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@40301559af1f79edd8d81a67e9cf77c56ebfb2d3 # 1.79.0, host toolchain per rust-toolchain.toml
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # ~/.cargo/bin holds anchor-cli, which has its own image-keyed cache
          # below. Letting rust-cache restore it too (keyed without the image)
          # makes `cargo install` skip rebuilding a binary from an older image.
          cache-bin: false
      # Cheap checks first: fail in seconds on style/lint instead of after the
      # toolchain install and lto build.
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p reservepay --all-targets -- -D warnings
      - name: Record runner image version
        id: runner-image
        run: echo "version=${ImageVersion:?runner image version is required}" >> "$GITHUB_OUTPUT"
      - name: Cache Solana toolchain
        id: solana
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.local/share/solana/install
            ~/.cache/solana
          # Runner image updates can break cached binaries, so key on the image.
          # "tarball" retires caches filled by the old, unverified installer.
          key: solana-3.1.7-tarball-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}
      - name: Install Agave 3.1.7
        if: steps.solana.outputs.cache-hit != 'true'
        # Download the release tarball itself and check it against the sha256
        # GitHub publishes for the v3.1.7 asset — verifying only the bootstrap
        # installer would leave the binaries it downloads unchecked. Laid out
        # the way agave-install does it, so active_release/bin works the same.
        # (cargo-build-sbf still fetches platform-tools itself at build time.)
        run: |
          release="$HOME/.local/share/solana/install/releases/3.1.7"
          mkdir -p "$release"
          curl -sSfL -o /tmp/solana-release.tar.bz2 \
            https://github.com/anza-xyz/agave/releases/download/v3.1.7/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          echo "8f12c5694f1ac02b1744da810b9c9a15eb334f8ef055f3ac98123dbf539c9f3b  /tmp/solana-release.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/solana-release.tar.bz2 -C "$release"
          ln -sfn "$release/solana-release" "$HOME/.local/share/solana/install/active_release"
      - name: Put Agave on PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: solana --version
      - name: Cache anchor-cli
        id: anchor-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-1.0.2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner-image.outputs.version }}
      - name: Install anchor-cli 1.0.2
        if: steps.anchor-cli.outputs.cache-hit != 'true'
        # Pinned to the commit tagged v1.0.2 (tags can move). anchor's lockfile
        # needs edition2024 (Rust >=1.85) — this only builds the CLI tool, the
        # program itself still builds with the pinned platform-tools.
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 install --git https://github.com/coral-xyz/anchor --rev 1314a6b83b16e6a31947b372d57988fd0e81559c anchor-cli --locked
      - name: Create a throwaway validator wallet
        run: solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json
      - run: bun install --frozen-lockfile
      - run: bun run --filter @reservepay/core build # tests import apps/web/src/* which import @reservepay/core → dist/
      - id: build
        name: Build the program
        # Shared with `bun run test:program` and devnet redeploys: builds with
        # --ignore-keys (CI's throwaway program keypair; the validator loads the
        # program at the Anchor.toml address) and fails when cargo-build-sbf
        # reports a frame over the 4096-byte stack limit.
        run: bun run build:program
      - id: idlcheck
        run: bun run idl:check
      # Run the tests even when idl:check failed, so drift and test failures
      # surface in the same run instead of hiding behind each other.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: anchor test --skip-build --validator legacy # anchor 1.0 defaults to surfpool, which isn't installed; legacy = Agave's solana-test-validator
